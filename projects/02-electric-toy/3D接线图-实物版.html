<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';

// ============================================================
// 基础场景（Z 轴朝上）
// ============================================================
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 6000);
camera.up.set(0,0,1);
camera.position.set(80, -360, 320);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.08;
ctrl.target.set(10, 0, 8);

// 灯光
scene.add(new THREE.AmbientLight(0x556070, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.5);
key.position.set(200,-300,500); key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-400; key.shadow.camera.right=400;
key.shadow.camera.top=400; key.shadow.camera.bottom=-400;
key.shadow.camera.near=1; key.shadow.camera.far=1600;
key.shadow.bias=-0.0006;
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.5); fill.position.set(-300,250,200); scene.add(fill);
const rim  = new THREE.DirectionalLight(0xffaa66, 0.35); rim.position.set(150,300,-250); scene.add(rim);

// 地面（XY 平面）+ 网格
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1600, 1600),
  new THREE.MeshStandardMaterial({color:0x10141a, roughness:0.95, metalness:0.05}));
ground.position.z = -1.5; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(1400, 70, 0x243040, 0x161d26);
grid.rotation.x = Math.PI/2; grid.position.z = -1.4; scene.add(grid);

// ============================================================
// 材质
// ============================================================
const matCache = new Map();
function matOf(color, opt){
  const k = color + '|' + JSON.stringify(opt||{});
  if(matCache.has(k)) return matCache.get(k);
  const m = new THREE.MeshStandardMaterial(Object.assign(
    {color, roughness:0.5, metalness:0.25}, opt||{}));
  matCache.set(k,m); return m;
}

// ============================================================
// 基板：7×9cm 洞洞板（模块焊 2.54 排母后插装其上）
// 平面在 XY，Z 朝上；板上表面 z = 0
// ============================================================
const BOARD_W = 92, BOARD_H = 72, BOARD_T = 1.6;
const boardGroup = new THREE.Group();
scene.add(boardGroup);
(function buildBoard(){
  const slab = new THREE.Mesh(new THREE.BoxGeometry(BOARD_W, BOARD_H, BOARD_T),
    matOf(0x1f6f4a, {roughness:0.85, metalness:0.05}));
  slab.position.set(0, 0, -BOARD_T/2);
  slab.castShadow = true; slab.receiveShadow = true;
  boardGroup.add(slab);
  boardGroup.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(slab.geometry),
    new THREE.LineBasicMaterial({color:0x2e8f60})));

  // 孔阵
  const PITCH = 2.54;
  const cols = Math.floor(BOARD_W/PITCH), rows = Math.floor(BOARD_H/PITCH);
  const holeGeo = new THREE.CylinderGeometry(0.68, 0.68, BOARD_T + 0.6, 8);
  holeGeo.rotateX(Math.PI/2);
  const holes = new THREE.InstancedMesh(holeGeo,
    new THREE.MeshStandardMaterial({color:0x07130d, roughness:1}), cols*rows);
  const dummy = new THREE.Object3D();
  let n = 0;
  for(let cx=0; cx<cols; cx++){
    for(let cy=0; cy<rows; cy++){
      dummy.position.set(-(cols-1)*PITCH/2 + cx*PITCH,
                         -(rows-1)*PITCH/2 + cy*PITCH, -BOARD_T/2);
      dummy.updateMatrix();
      holes.setMatrixAt(n++, dummy.matrix);
    }
  }
  boardGroup.add(holes);
})();

// ============================================================
// 元件数据（引脚丝印严格按实物）
// o = [x, y] 引脚相对元件中心的局部坐标；引脚自动落在元件顶面，方向沿 (x,y) 向外
// ============================================================
const COMPS = [
  // ---------- 主控（板载 24 个排针：上10 / 下10 / 右4） ----------
  { id:'mcu', name:'STC8G1K08 开发板', sub:'上10 / 下10 / 右4 脚',
    shape:{w:36, h:24, d:6}, pos:[0, 0, 3], color:0x123049,
    pins:[
      // 上排（左→右）：GND VCC GND P55 VCC P54 P17 P16 P11 P10
      {k:'T_GND1', sn:'GND', o:[-15.3, 12]},
      {k:'T_VCC1', sn:'VCC', o:[-11.9, 12]},
      {k:'T_GND2', sn:'GND', o:[-8.5,  12]},
      {k:'P55',    sn:'P55', o:[-5.1,  12]},
      {k:'T_VCC2', sn:'VCC', o:[-1.7,  12]},
      {k:'P54',    sn:'P54', o:[1.7,   12]},

      {k:'P11',    sn:'P11', o:[11.9,  12]},
      {k:'P10',    sn:'P10', o:[15.3,  12]},
      // 下排（左→右）：GND VCC P30 P31 P32 P33 P34 P35 P36 P37
      {k:'B_GND1', sn:'GND', o:[-15.3,-12]},
      {k:'B_VCC1', sn:'VCC', o:[-11.9,-12]},
      {k:'P30',    sn:'P30', o:[-8.5, -12]},
      {k:'P31',    sn:'P31', o:[-5.1, -12]},
      {k:'P32',    sn:'P32', o:[-1.7, -12]},
      {k:'P33',    sn:'P33', o:[1.7,  -12]},
      {k:'P34',    sn:'P34', o:[5.1,  -12]},
      {k:'P35',    sn:'P35', o:[8.5,  -12]},
      {k:'P36',    sn:'P36', o:[11.9, -12]},
      {k:'P37',    sn:'P37', o:[15.3, -12]},
      // 右侧（上→下）：VCC TX RX GND
      {k:'R_VCC', sn:'VCC', o:[18,  4.5]},
      {k:'TX',    sn:'TX',  o:[18,  1.5]},
      {k:'RX',    sn:'RX',  o:[18, -1.5]},
      {k:'R_GND', sn:'GND', o:[18, -4.5]},

  // ---------- 驱动 ----------
  { id:'drv', name:'TB6612FNG 驱动板', sub:'双H桥 · 仅用 A 通道',
    shape:{w:24, h:20, d:5}, pos:[32, 18, 2.5], color:0x4a2a2a,
    pins:[
      // 左列（上→下）
      {k:'PWMA', sn:'PWMA', o:[-12,  9.1]},
      {k:'AIN1', sn:'AIN1', o:[-12,  6.5]},
      {k:'AIN2', sn:'AIN2', o:[-12,  3.9]},
      {k:'STBY', sn:'STBY', o:[-12,  1.3]},
      {k:'BIN1', sn:'BIN1', o:[-12, -1.3]},
      {k:'BIN2', sn:'BIN2', o:[-12, -3.9]},
      {k:'PWMB', sn:'PWMB', o:[-12, -6.5]},
      {k:'L_GND',sn:'GND',  o:[-12, -9.1]},
      // 右列（上→下）：VM VCC GND AO1 AO2 BO2 BO1 GND
      {k:'VM',     sn:'VM',  o:[12,  9.1]},
      {k:'VCC',    sn:'VCC', o:[12,  6.5]},
      {k:'R_GND',  sn:'GND', o:[12,  3.9]},
      {k:'AO1',    sn:'AO1', o:[12,  1.3]},
      {k:'AO2',    sn:'AO2', o:[12, -1.3]},
      {k:'BO2',    sn:'BO2', o:[12, -3.9]},
      {k:'BO1',    sn:'BO1', o:[12, -6.5]},
      {k:'R_GND2', sn:'GND', o:[12, -9.1]},
    ]},

  // ---------- 降压 ----------
  { id:'mp', name:'MP1584EN 降压模块', sub:'7.4V → 5V',
    shape:{w:24, h:14, d:5}, pos:[-34, 26, 2.5], color:0x2b3340,
    pins:[
      {k:'INP',  sn:'IN+',  o:[-12,  4]},
      {k:'INN',  sn:'IN-',  o:[-12, -4]},
      {k:'OUTP', sn:'OUT+', o:[12,   4]},
      {k:'OUTN', sn:'OUT-', o:[12,  -4]},
    ]},

  // ---------- 开关机 ----------
  { id:'sw', name:'长按3s开关机模块', sub:'长按开 / 长按关',
    shape:{w:24, h:16, d:6}, pos:[-34, 2, 3], color:0x333a44,
    pins:[
      {k:'UP',   sn:'U+',   o:[-12,  5]},
      {k:'UN',   sn:'U-',   o:[-12, -5]},
      {k:'OUTP', sn:'OUT+', o:[12,   5]},
      {k:'OUTN', sn:'OUT-', o:[12,  -5]},
      {k:'SW1',  sn:'SW',   o:[-4,   8]},
      {k:'SW2',  sn:'SW',   o:[4,    8]},
      {k:'XSW1', sn:'SW+',  o:[-4,  -8]},
      {k:'XSW2', sn:'SW-',  o:[4,   -8]},
    ]},

  // ---------- 保护板 ----------
  { id:'pcm', name:'2S 7.4V 锂电池保护板', sub:'过充/过放/短路/6A',
    shape:{w:24, h:16, d:5}, pos:[-34, -24, 2.5], color:0x1f4d2e,
    pins:[
      {k:'BP', sn:'B+', o:[-12,  5]},
      {k:'BM', sn:'BM', o:[-12,  0]},
      {k:'BN', sn:'B-', o:[-12, -5]},
      {k:'PP', sn:'P+', o:[12,   5]},
      {k:'PN', sn:'P-', o:[12,  -5]},

  // ---------- 充电板 ----------
  { id:'chg', name:'2S 锂电池充电模块', sub:'Type-C 5V → 8.4V',
    shape:{w:26, h:14, d:5}, pos:[0, -27, 2.5], color:0x2b3340,
    pins:[
      {k:'BP',  sn:'B+',  o:[-8,  7]},
      {k:'BM',  sn:'BM',  o:[0,   7]},
      {k:'BN',  sn:'B-',  o:[8,   7]},
      {k:'VIN', sn:'VIN', o:[13,  3]},
      {k:'CGND',sn:'GND', o:[13, -3]},
    ]},

  // ---------- 直滑电位器 ----------
  { id:'pot', name:'直滑电位器 45mm B10K', sub:'滑条调速',
    shape:{w:10, h:34, d:6}, pos:[30, -18, 3], color:0x3a3f48,
    pins:[
      {k:'P1', sn:'1', o:[-5,  9]},
      {k:'P2', sn:'2', o:[-5,  0]},
      {k:'P3', sn:'3', o:[-5, -9]},
    ]},

  // ---------- 按键 ----------
  { id:'pwr', name:'电源开关键', sub:'轻触 6×6',
    shape:{w:8, h:8, d:5}, pos:[-16, -28, 2.5], color:0xb5713a,
    pins:[ {k:'B1', sn:'1', o:[-4, 4]}, {k:'B2', sn:'2', o:[4, 4]} ]},

  { id:'btn', name:'模式切换按键', sub:'轻触 6×6',
    shape:{w:8, h:8, d:5}, pos:[18, -28, 2.5], color:0x9a3b3b,
    pins:[ {k:'B1', sn:'1', o:[-4, 4]}, {k:'B2', sn:'2', o:[4, 4]} ]},

  // ---------- 板外：电芯 ----------
  { id:'b1', name:'电芯 1', sub:'103450 3.7V',
    shape:{w:44, h:22, d:20}, pos:[-92, -14, 10], color:0x2f3540,
    pins:[ {k:'NEG', sn:'-', o:[22, -6]}, {k:'POS', sn:'+', o:[22, 6]} ]},

  { id:'b2', name:'电芯 2', sub:'103450 3.7V',
    shape:{w:44, h:22, d:20}, pos:[-92, 14, 10], color:0x2f3540,
    pins:[ {k:'NEG', sn:'-', o:[22, -6]}, {k:'POS', sn:'+', o:[22, 6]} ]},

  // ---------- 板外：电机 + 编码器（一体，屁股自带 PH2.0 母座） ----------
  { id:'mot', name:'JGB37-520 减速电机', sub:'6V 100rpm · 霍尔AB相 · 减速比56 · PH2.0 座',
    shape:{w:30, h:46, d:46}, pos:[98, 0, 23], color:0x7d838c,
    pins:[
      {k:'M_PLUS', sn:'红 M+',  o:[-15, 16]},
      {k:'M_MINUS',sn:'白 M-',  o:[-15, 11]},
      {k:'VCC',    sn:'蓝 5V',  o:[-15,  6]},
      {k:'GND',    sn:'黑 GND', o:[-15,  1]},
      {k:'ENC_A',  sn:'黄 A',   o:[-15, -4]},
      {k:'ENC_B',  sn:'绿 B',   o:[-15, -9]},
    ]},
];

// ============================================================
// 连线表（引脚级）—— 配色见面板图例
// ============================================================
const C_74='#ff4d4d', C_GND='#4a4a4a', C_5V='#ffb020', C_PWM='#b06bff',
      C_ADC='#25c8c8', C_EA='#38c26b', C_EB='#8ae04a', C_MOT='#ffd400',
      C_KEY='#9aa6b5', C_MID='#e0e0e0';

const WIRES = [
  // ---- 电芯串接 2S（黑/中线/红）；充电板接保护板 P+/P-（走保护 FET 路径才能激活保护 IC，接 B+/B- 会绕过保护）----
  ['b1.NEG','pcm.BN', C_GND],
  ['b1.POS','pcm.BM', C_MID],
  ['b2.NEG','pcm.BM', C_MID],
  ['b2.POS','pcm.BP', C_74],
  ['pcm.PP','chg.BP', C_74],
  ['pcm.BM','chg.BM', C_MID],
  ['pcm.PN','chg.BN', C_GND],

  // ---- 保护板输出 → 开关机模块输入 ----
  ['pcm.PP','sw.UP', C_74],
  ['pcm.PN','sw.UN', C_GND],

  // ---- 开关机输出 7.4V → TB6612 VM 与 MP1584 IN+；输出负 → IN- ----
  ['sw.OUTP','drv.VM', C_74],
  ['sw.OUTP','mp.INP', C_74],
  ['sw.OUTN','mp.INN', C_GND],

  // ---- 5V 分配（MP1584 OUT+）：MCU / 驱动 VCC / STBY / 编码器蓝 / 电位器 1 ----
  ['mp.OUTP','mcu.T_VCC1', C_5V],
  ['mp.OUTP','drv.VCC',    C_5V],
  ['mp.OUTP','drv.STBY',   C_5V],
  ['mp.OUTP','mot.VCC',    C_5V],
  ['mp.OUTP','pot.P1',     C_5V],

  // ---- GND 分配（MP1584 OUT-）：MCU / 驱动 GND / 编码器黑 / 电位器 3 / 模式键 ----
  ['mp.OUTN','mcu.T_GND1', C_GND],
  ['mp.OUTN','drv.R_GND',  C_GND],
  ['mp.OUTN','mot.GND',    C_GND],
  ['mp.OUTN','pot.P3',     C_GND],
  ['mp.OUTN','btn.B2',     C_GND],

  // ---- 电机大电流地回路：开关机 OUT− 直连 TB6612 GND（22AWG，回流不穿过 MP1584） ----
  ['sw.OUTN','drv.R_GND',  C_GND],

  // ---- MCU → TB6612 控制信号 ----
  ['mcu.P54','drv.PWMA', C_PWM],
  ['mcu.P55','drv.AIN1', C_PWM],
  ['mcu.P37','drv.AIN2', C_PWM],

  // ---- TB6612 B 通道未用：BIN1/BIN2 接地，避免输入悬空 ----
  ['drv.BIN1','drv.R_GND', C_GND],
  ['drv.BIN2','drv.R_GND', C_GND],

  // ---- TB6612 → 电机动力 ----
  ['drv.AO1','mot.M_PLUS',  C_MOT],
  ['drv.AO2','mot.M_MINUS', C_MOT],

  // ---- 编码器 → MCU ----
  ['mot.ENC_A','mcu.P32', C_EA],
  ['mot.ENC_B','mcu.P33', C_EB],

  // ---- 电位器滑条 → ADC ----
  ['pot.P2','mcu.P10', C_ADC],

  // ---- 按键 ----
  ['btn.B1','mcu.P11', C_KEY],   // 模式键：P1.1 ↔ GND(另一端)
  ['pwr.B1','sw.SW1',  C_KEY],   // 电源键：跨接开关机模块 SW / SW
  ['pwr.B2','sw.SW2',  C_KEY],
];

// ============================================================
// 说明标注（灰色虚线框）
// ============================================================
const NOTES = [
  {t:'可选：就近加 100µF/16V（当前不加）', p:[52, 30, 10]},
  {t:'SW+ / SW- 未使用', p:[-46, -12, 8]},
  {t:'B 通道未使用（BIN1/BIN2 已接地，PWMB/BO1/BO2 悬空）', p:[30, 36, 12]},
  {t:'TX / RX = 下载口（不接线）', p:[30, 4, 10]},
  {t:'VIN / GND 未使用 · Type-C 为充电输入', p:[2, -40, 8]},
  {t:'两节电芯置于洞洞板外', p:[-92, -34, 16]},
  {t:'电机装在机构上（板外）', p:[98, -40, 16]},
  {t:'7×9cm 洞洞板 · 模块焊 2.54 排母后插装', p:[0, -42, 6]},
];

// ============================================================
// 标签系统（HTML 叠加层）
// ============================================================
const labelLayer = document.getElementById('labels');
const labelItems = [];
function addLabel(text, pos, kind){
  const el = document.createElement('div');
  el.className = 'lbl ' + kind;
  el.textContent = text;
  labelLayer.appendChild(el);
  labelItems.push({el, pos:pos.clone(), kind});
}

// ============================================================
// 构建元件 + 引脚
// ============================================================
const pinPos = {};
const compGroups = [];

const pinMat    = new THREE.MeshStandardMaterial({color:0xd8b45a, roughness:0.3, metalness:0.95});
const pinTipMat = new THREE.MeshStandardMaterial({color:0xffe28a, roughness:0.25, metalness:0.9,
  emissive:0x8a6a10, emissiveIntensity:0.5});

function buildComponent(c){
  const g = new THREE.Group();
  const s = c.shape;
  g.position.set(c.pos[0], c.pos[1], c.pos[2]);

  const body = new THREE.Mesh(new THREE.BoxGeometry(s.w, s.h, s.d), matOf(c.color));
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  g.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(body.geometry),
    new THREE.LineBasicMaterial({color:0x5b7fa8})));

  const topZ = c.pos[2] + s.d/2 + 0.8;
  addLabel(c.name, new THREE.Vector3(c.pos[0], c.pos[1], topZ + 10), 'comp');
  if(c.sub) addLabel(c.sub, new THREE.Vector3(c.pos[0], c.pos[1], topZ + 4.6), 'comp');

  const stubLen = 4.5;
  for(const p of c.pins){
    const [ox, oy] = p.o;
    const world = new THREE.Vector3(c.pos[0]+ox, c.pos[1]+oy, topZ);

    let dir = new THREE.Vector3(ox, oy, 0);
    if(dir.length() < 1e-3) dir.set(0, 1, 0);
    dir.normalize();

    const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, stubLen, 6), pinMat);
    stub.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
    stub.position.copy(world).addScaledVector(dir, stubLen/2);
    g.add(stub);

    const tipPos = world.clone().addScaledVector(dir, stubLen);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(1.3, 10, 8), pinTipMat);
    tip.position.copy(tipPos);
    g.add(tip);

    pinPos[c.id+'.'+p.k] = tipPos;
    if(p.sn) addLabel(p.sn, tipPos.clone().addScaledVector(dir, 3.2).add(new THREE.Vector3(0,0,3)), 'pin');
  }
  compGroups.push(g); scene.add(g);
}
COMPS.forEach(buildComponent);

// 说明标注
NOTES.forEach(n => addLabel(n.t, new THREE.Vector3(n.p[0], n.p[1], n.p[2]), 'note'));

// ============================================================
// 连接线（弧形管线）
// ============================================================
const wireGroup = new THREE.Group();
scene.add(wireGroup);

function buildWire(aKey, bKey, hex){
  const A = pinPos[aKey], B = pinPos[bKey];
  if(!A || !B){ console.warn('未知引脚', aKey, bKey); return; }

  const d = A.distanceTo(B);
  const lift = 8 + d*0.12;
  const mid = A.clone().add(B).multiplyScalar(0.5);
  mid.z += lift;
  const c1 = A.clone().lerp(mid, 0.5); c1.z += lift*0.4;
  const c2 = mid.clone().lerp(B, 0.5); c2.z += lift*0.4;

  const curve = new THREE.CatmullRomCurve3([A, c1, mid, c2, B]);
  const geo = new THREE.TubeGeometry(curve, 36, 0.9, 6, false);
  const col = new THREE.Color(hex);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    color:col, roughness:0.45, metalness:0.15,
    emissive:col, emissiveIntensity:0.4}));
  mesh.castShadow = true;
  wireGroup.add(mesh);
}
WIRES.forEach(w => buildWire(w[0], w[1], w[2]));

// ============================================================
// 显示控制
// ============================================================
const state = { name:true, pin:true, wire:true, note:true, board:true, rot:false };

document.getElementById('cName').addEventListener('change', e=>{ state.name = e.target.checked; });
document.getElementById('cPin').addEventListener('change', e=>{ state.pin = e.target.checked; });
document.getElementById('cWire').addEventListener('change', e=>{ state.wire = e.target.checked; wireGroup.visible = state.wire; });
document.getElementById('cNote').addEventListener('change', e=>{ state.note = e.target.checked; });
document.getElementById('cBoard').addEventListener('change', e=>{ state.board = e.target.checked; boardGroup.visible = state.board; });
document.getElementById('cRot').addEventListener('change', e=>{ state.rot = e.target.checked; });

// 视角
const VIEWS = {
  iso:   {pos:[80,-360,320],  tgt:[10,0,8]},
  top:   {pos:[10,-30,470],   tgt:[10,0,0]},
  power: {pos:[-240,-170,200],tgt:[-70,-8,10]},
  ctrl:  {pos:[160,110,250],  tgt:[70,8,12]},
};
document.querySelectorAll('#panel [data-view]').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#panel [data-view]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const v = VIEWS[b.dataset.view];
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    ctrl.target.set(v.tgt[0], v.tgt[1], v.tgt[2]);
    ctrl.update();
  });
});

addEventListener('keydown', e=>{
  if(e.key === 'r' || e.key === 'R'){
    camera.position.set(80,-360,320);
    ctrl.target.set(10,0,8); ctrl.update();
  }
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// 标签投影更新
// ============================================================
const _v = new THREE.Vector3();
function updateLabels(){
  for(const it of labelItems){
    if(it.kind === 'comp' && !state.name){ it.el.style.display='none'; continue; }
    if(it.kind === 'pin'  && !state.pin ){ it.el.style.display='none'; continue; }
    if(it.kind === 'note' && !state.note){ it.el.style.display='none'; continue; }
    _v.copy(it.pos).project(camera);
    if(_v.z > 1){ it.el.style.display='none'; continue; }
    const x = ( _v.x*0.5 + 0.5) * innerWidth;
    const y = (-_v.y*0.5 + 0.5) * innerHeight;
    if(x < -220 || x > innerWidth+220 || y < -120 || y > innerHeight+120){
      it.el.style.display='none'; continue;
    }
    it.el.style.display='block';
    it.el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
  }
}

// ============================================================
// 主循环
// ============================================================
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if(state.rot) scene.rotation.z += dt * 0.12;
  ctrl.update();
  renderer.render(scene, camera);
  updateLabels();
}
loop();

document.getElementById('loading').style.display = 'none';
</script>

<script>
// 显示控制面板：显示 / 隐藏
const pToggle = document.getElementById('panelToggle');
const panes = ['panel'].map(id=>document.getElementById(id)).filter(Boolean);
pToggle.addEventListener('click', ()=>{
  const hide = pToggle.dataset.hidden !== '1';
  panes.forEach(p=>p.classList.toggle('hidden', hide));
  pToggle.dataset.hidden = hide ? '1' : '0';
  pToggle.textContent = hide ? '显示面板' : '隐藏面板';
});
</script>
</body>
</html>
